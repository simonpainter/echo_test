name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please fill out the details below.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
      placeholder: A clear and concise summary.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact commands and input where possible.
      placeholder: |
        1. Run ...
        2. Connect to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and network context.
      placeholder: macOS 14, Python 3.11, host in same VPC, etc.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output/logs
      description: Paste terminal output, traceback, or CSV snippets.
      render: shell
